<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lời Nhắn Ngọt Ngào 8/3</title>

<style>
:root{
--bg-color:#fce4ec;
--envelope-color:#f48fb1;
--envelope-flap:#f06292;
--paper-color:#ffffff;
--text-color:#444;
--heart-color:#d81b60;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background-color:var(--bg-color);
font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
overflow:hidden;
}

.wrapper{
position:relative;
width:300px;
height:200px;
display:flex;
justify-content:center;
align-items:center;
}

.container{
position:relative;
cursor:pointer;
width:100%;
height:100%;
perspective:1000px;
}

.envelope-wrapper{
position:relative;
width:100%;
height:100%;
background-color:var(--envelope-color);
box-shadow:0 10px 30px rgba(0,0,0,0.1);
z-index:10;
}

.flap{
position:absolute;
top:0;
left:0;
width:0;
height:0;
border-left:150px solid transparent;
border-right:150px solid transparent;
border-top:110px solid var(--envelope-flap);
transform-origin:top;
transition:transform 0.6s ease-in-out;
z-index:40;
}

.front{
position:absolute;
bottom:0;
left:0;
width:0;
height:0;
border-left:150px solid var(--envelope-color);
border-right:150px solid var(--envelope-color);
border-bottom:110px solid #f06292;
z-index:30;
}

.heart{
position:absolute;
top:-15px;
left:50%;
transform:translateX(-50%);
width:25px;
height:25px;
background-color:var(--heart-color);
z-index:45;
clip-path:path('M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z');
transition:transform 0.6s,opacity 0.4s;
}

.letter{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,200px);
width:280px;
height:180px;
background-color:var(--paper-color);
padding:15px;
z-index:20;
transition:transform 0.8s ease,height 0.8s ease;
box-shadow:0 0 15px rgba(0,0,0,0.1);
overflow:hidden;
display:flex;
flex-direction:column;
align-items:center;
border-radius:5px;
}

.letter-content{
width:100%;
opacity:0;
transition:opacity 0.5s ease 0.4s;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
}

.letter h2{
font-size:16px;
color:#d81b60;
margin-top:5px;
margin-bottom:8px;
font-weight:bold;
}

.letter p{
font-size:11px;
line-height:1.4;
color:var(--text-color);
margin-bottom:10px;
}

.photo-frame{
background:white;
padding:5px 5px 20px 5px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
transform:rotate(-1.5deg);
width:150px;
}

.photo-frame img{
width:100%;
height:180px;
object-fit:cover;
object-position:center;
border-radius:3px;
display:block;
}

.signature{
align-self:flex-end;
font-size:11px;
font-weight:bold;
font-style:italic;
color:#d81b60;
margin-top:8px;
}

.container.open .flap{
transform:rotateX(180deg);
z-index:5;
}

.container.open .letter{
transform:translate(-50%,-50%);
height:420px;
z-index:35;
}

.container.open .letter-content{
opacity:1;
}

.container.open .heart{
transform:translateX(-50%) translateY(-190px) scale(1.1);
opacity:0.5;
}

.hint{
position:absolute;
bottom:-50px;
width:100%;
text-align:center;
color:#ad1457;
font-weight:bold;
font-size:16px;
animation:bounce 2s infinite;
}

@keyframes bounce{
0%,20%,50%,80%,100%{transform:translateY(0);}
40%{transform:translateY(-10px);}
60%{transform:translateY(-5px);}
}
</style>
</head>

<body>

<div class="wrapper">
<div class="container" id="mainContainer">

<div class="envelope-wrapper">
<div class="flap"></div>
<div class="front"></div>
<div class="heart"></div>

<div class="letter">
<div class="letter-content">

<h2>Gửi Bé Yêu ❤️</h2>

<p>
Chúc mừng ngày 8/3!  
Chúc em luôn xinh đẹp, rạng rỡ và hạnh phúc bên anh nhé.  
Yêu em rất nhiều ✨!
</p>

<div class="photo-frame">
<img src="IMG_1561.jpg" alt="Ảnh kỷ niệm">
</div>

<div class="signature">Anh yêu em!</div>

</div>
</div>

</div>

<div class="hint" id="hint">Mở thư ở đây nè!</div>

</div>
</div>

<script>
const container=document.getElementById("mainContainer");
const hint=document.getElementById("hint");

container.addEventListener("click",()=>{
container.classList.toggle("open");
hint.style.opacity=container.classList.contains("open")?"0":"1";
});
</script>

</body>
</html>
