<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album 8/3</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd1dc,#ffc0cb);
font-family:sans-serif;
overflow:hidden;
}

/* khung album /

.album{
width:320px;
height:420px;
perspective:2000px;
cursor:pointer;
}

.book{
width:100%;
height:100%;
position:relative;
transform-style:preserve-3d;
transition:transform 1s;
}

/ trang /

.page{
position:absolute;
width:100%;
height:100%;
background:white;
border-radius:10px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
padding:20px;
backface-visibility:hidden;
}

/ trang bìa /

.cover{
background:linear-gradient(135deg,#ff9eb5,#ff6fa0);
color:white;
font-size:24px;
font-weight:bold;
}

/ trang chữ /

.text{
font-size:18px;
text-align:center;
color:#c2185b;
line-height:1.5;
}

/ trang ảnh /

.photo img{
width:90%;
border-radius:10px;
box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

/ trang sau /

.back{
transform:rotateY(180deg);
}

/ hiệu ứng mở */

.open .book{
transform:rotateY(180deg);
}

.hint{
position:absolute;
bottom:40px;
font-size:16px;
color:#c2185b;
animation:blink 1.5s infinite;
}

@keyframes blink{
0%,100%{opacity:1}
50%{opacity:0.3}
}

</style>
</head>

<body>

<div class="album" id="album">

<div class="book">

<!-- Bìa -->

<div class="page cover">
💖 Album 8/3 💖
<br><br>
Chạm để mở
</div>

<!-- Nội dung -->

<div class="page back">

<div class="text">
Cảm ơn em vì luôn xuất hiện trong cuộc sống của anh.<br><br>
Chúc em luôn xinh đẹp, hạnh phúc và luôn mỉm cười 💗
</div>

<br>

<div class="photo">
<img src="IMG_1561.jpg">
</div>

</div>

</div>

</div>

<div class="hint">
Chạm vào album để mở 📖
</div>

<script>

const album=document.getElementById("album");

album.addEventListener("click",()=>{
album.classList.toggle("open");
});

</script>

</body>
</html>
